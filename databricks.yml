bundle:
  name: hls_ml

sync:
  include:
    - "*.ipynb"
    - "*.py"
    - "*.yml"
    - "*.yaml"
    - "*.json"
    - "*.csv"
    - "*.parquet"
    - "*.txt"
    - "*.md"
  exclude:
    - ".git/**"
    - ".databricks/**"
    - ".vscode/**"
    - "typings/**"
    - "__pycache__/**"
    - "*.pyc"
    - ".DS_Store"

resources:
  jobs:
    hls_ml:
      name: hls_ml
      job_clusters:
        - job_cluster_key: "Job_cluster"
          new_cluster:
              spark_version: 12.2.x-scala2.12
              node_type_id: Standard_DS3_v2
              num_workers: 1
      tasks:
      - task_key: "load_data"
        run_if: "ALL_SUCCESS"
        notebook_task:
          notebook_path: ./01-load-data.py
          base_parameters:
            reset_all_data: false
            db: hls_ml
            catalog: dbdemos
            folder: s3://one-env-uc-external-location/kp_ml_demo_dev

            "source": "WORKSPACE"
          # job_cluster_key: Job_cluster

targets:

  dev:
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net/
      root_path: /Workspace/riley.rustad@databricks.com/.bundle/${bundle.target}/${bundle.name}



